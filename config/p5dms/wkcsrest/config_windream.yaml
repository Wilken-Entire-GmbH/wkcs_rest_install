Connectors:
  windream: 
    defaults:
      mapping: 
        fromWin: 
          dwDocID: dmsID 
          wmVar05: Hausnr
          wmVar04: Hausunternr
          szText34: Rechnungsnummer
          szText11: Kontaktgrund
          szText39: Kundennummer
          szText36: Straße
          szText14: DatumWilken
          szText38: Name
          wmVar01: Vorname
          szText07: wilkenID
          wmVar00: Zählernummer
        toWin: 
          dmsID: dwDocID
          Hausnr: wmVar05
          Hausunternr: wmVar04
          Rechnungsnummer: szText34
          Kontaktgrund: szText11
          Kundennummer: szText39
          Straße: szText36
          DatumWilken: szText14
          Name: szText38
          Vorname: wmVar01
          wilkenID: szText07
          Zählernummer: wmVar00
      templates:
        addsearch: 
          Mode: Synchronous
          Entity: Document
          Sorting: 
            AttributeName: <var> 
            Direction: Ascending 
          AttributeFlags: Default 
          Values: <var> 
        search: 
          Mode: Synchronous
          Entity: Document
          Conditions: 
            - Column: <var>
              Value: <var> 
              SearchOperator: StringLike
              AutoWildcards: false 
              SearchRelation: Undefined 
              LeftBrackets: 0 
              RightBrackets: 0
          Sorting: 
            AttributeName: <var> 
            Direction: Ascending 
          AttributeFlags: Default 
          Values: <var> 
        update: 
          Item:       
            Attributes: <var>
            Id: <var>  
          ResponseDetails: 0
          CreateNewVersion: false  
        delete: 
          Item: 
            Id: <var>
          Flags: 2 
          ResponseDetail: 0
        create: 
          Item: 
            ObjectType: 
              Name: <var>
            Attributes: <var> 
            Location: <var> 
            Name: <var> 
          CreateFolder: true 
          ResponseDetails: 0 

    baseUrl: ${config.env.baseURL}

    authorization: 
      type: Basic 
      options: 
        user: ${env.WKCSREST_AUTH_USER} 
        password: ${env.WKCSREST_AUTH_PASSWORD}
    connection: 
      type: p5dms 
      options: {}
    mappings: {}
    wkcsMethods:  
      test: 
        invoke: 
          transform: |
            = 
            {
              "message": "WKCS Restservice is alive"
            }

      searchDocuments:
        invoke: 
          request: 
            url: /search/paginated
            params: 
              query: |
                = 
                (
                  $v_i := function($v) { "[" & ($v ~> $split(',') ~> $map(function($v) { "'" & $v & "'"}) ~> $join(',')) & "]" }; 
                  $v_like := function($v) { "'%" & $v & "%'"}; 
                  $v_default := function($v) { "'" & $v & "'" }; 
                  $vals := {"~": $v_like,   "i": $v_i,   "_": $v_default };
                  $mapVals := function($o, $v) { $lookup($vals, $lookup($vals, $o) ? $o : "_")($v) }; 

                  $ops := { "~":"like", "=":"eq", "l":"lte", "g":"gte", ">":"gt", "!":"ne", "i":"in" };

                  $cond := function($v) {[ "data.backend.wcs." & $v.property.key,  $lookup($ops,$v.operator), $mapVals($v.operator, $v.property.value) ] ~> $join(' ') }; 

                  $format("%s and classifier in [ 'invoice', 'ermInvoice', 'ermVoucher']",soap.query.$cond($) ~> $join(' and '))
                )
              pagesize: |
                = soap.limit ? soap.limit : 100
              projection: data.backend.wcs 
              orderby: -createdate 
  
          transform: = response.data.rows
          mapping: p5dmsToWCS

      addDocumentToSplit: 
        invoke: 
          - request:
              method: post 
              url: '/windream.web.api/documents/Create'
              body: |
                = (
                    $objType := "Jahresverbrauchsabrechnung";
                    $location := 'Jahresverbrauchsabrechnung\\\\' & $fromMillis($toMillis($now()),"[M00]-[Y0001]"); 

                    $attrs := soap.contentDescription.properties.{ 
                        "Name": $lookup($$._defaults.mapping.toWin, key), 
                        "Value": $count([value]) < 2 ? [value][0] : value 
                    };

                    _defaults.templates.create ~> | Item | {  
                        "ObjectType": { "Name": $objType },
                        "Attributes": [$attrs], 
                        "Location": $location, 
                        "Name": $$.soap.contentDescription.filename 
                      } |;
                  )
              options: 
                requestType: json 
            transform: |
              = { "id": 4711 }
            storeAs: createDoc

      addDocument: 
        invoke: 
          - request:
              method: post
              url: "/windream.web.api/search/Search"
              body: |
                = (
                  $varId := soap.documentDescription.wilkenID ? "wilkenID" : "dmsID"; 
                  $docIdColumn := $lookup(_defaults.mapping.toWin,$varId);

                  _defaults.templates.addsearch ~> | $ | { "Conditions": [{ 
                        "Column": $docIdColumn , 
                        "Value": $lookup($$.soap.documentDescription,$varId), 
                        "SearchOperator": "StringLike", 
                        "AutoWildcards": false, 
                        "SearchRelation": "undefined", 
                        "LeftBrackets": 0,
                        "RightBrackets": 0
                        }] } |
                      ~> | Sorting | { "AttributeName": $docIdColumn }  |
                      ~> | $ | { "Values": $append($keys($$._defaults.mapping.fromWin),["##ObjectPath##"]) } |; 
                  )
              options: 
               requestType: json
            transform: '= { "id": response.data.Result[0].Attributes[Name = "dwDocID"].Value }'
            storeAs: windoc
            errors:
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("search windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)
          - enabled: '= windoc.id ? false : true'
            request:
              method: post 
              url: '/windream.web.api/documents/Create'
              body: |
                = (
                    $docIdColumn := $lookup(_defaults.mapping.toWin,"wilkenID");
                    $objType := "Jahresverbrauchsabrechnung";
                    $kontaktgrund := soap.documentDescription.properties[ key = "Kontaktgrund"].([value][0]);
                    $subFolder := $kontaktgrund ? $kontaktgrund : "keiner"; 
                    $location := 'Jahresverbrauchsabrechnung\\\\' & $fromMillis($toMillis($now()),"[M01]-[Y0001]") & '\\\\' & $subFolder; 
                    $extension := [$each($$._defaults.mimeTypes, function($v, $k) { $k[$v=$$.soap.documentDescription.mimeType] })][0]; 
                    $filename :=  soap.documentDescription.wilkenID & '.' & ($extension ? $extension : 'txt');
                    
                    $attrs := [soap.documentDescription.properties.{ 
                        "Name": $lookup($$._defaults.mapping.toWin, key), 
                        "Value": $count([value]) < 2 ? [value][0] : value 
                    }];

                    _defaults.templates.create ~> | Item | {  
                        "ObjectType": { "Name": $objType },
                        "Attributes": $append($attrs,{ "Name": $docIdColumn, "Value": $$.soap.documentDescription.wilkenID }), 
                        "Location": $location, 
                        "Name": $filename 
                      } |;
                  )
                  
              options: 
                requestType: json 
            transform: '= { "id": response.data.Item.Id }'
            errors: 
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("create windreamerror on create with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)
            storeAs: createDoc
    
          - request: 
              method: post
              url: '/windream.web.api/documents/Upload'
              params: 
                "['parameter.item.id']": '= createDoc.id ? createDoc.id : windoc.id'
                "['parameter.item.location']": |
                    = (
                        $kontaktgrund := soap.documentDescription.properties[ key = "Kontaktgrund"].([value][0]);
                        $subFolder := $kontaktgrund ? $kontaktgrund : "keiner"; 
                        
                        'Jahresverbrauchsabrechnung\\\\' & $fromMillis($toMillis($now()),"[M01]-[Y0001]") & '\\\\' & $subFolder 
                      )
                "['parameter.item.name']": = soap.documentDescription.filename
                "['parameter.flags']": = windoc.id ? 4 
              body: |
                =
                (
                    $extension := [$each($$._defaults.mimeTypes, function($v, $k) { $k[$v=$$.soap.documentDescription.mimeType] })][0]; 
                    $filename := soap.documentDescription.wilkenID & '.' & ($extension ? $extension : 'txt');
                    
                { 
                  "file": {
                    "type":"file",
                    "content": soap.documentData.data,
                    "contentType": soap.documentData.mimeType ? soap.documentData.mimeType : soap.documentDescription.mimeType,
                    "filename": $filename
                  }
                }
                )
              options: 
                requestType: formdata
            transform: | 
              = 
              {
                "dmsId": createDoc.id ? createDoc.id : windoc.id
              }
            errors: 
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("upload windreamerror on upload with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)
          - enabled: '= windoc.id ? true : false'
            request:          
              method: post 
              url: "/windream.web.api/documents/Update"
              body: | 
                = ( 
                    $attrs := soap.documentDescription.properties.{ 
                      "Name": $lookup($$._defaults.mapping.toWin, key), 
                      "Value": $count([value]) < 2 ? [value][0] : value 
                    };

                    _defaults.templates.update ~> | Item | { "Id": $$.windoc.id, "Attributes": [$attrs] } |
                  )
              options:
                requestType: json
            transform: |
              = { "dmsId": windoc.id }
            errors: 
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)


      updateProperties: 
        invoke:
          - request:
              method: post
              url: "/windream.web.api/search/Search"
              body: |
                = (
                  $varId := soap.wilkenID ? "wilkenID" : "dmsID"; 
                  $docIdColumn := $lookup(_defaults.mapping.toWin,$varId);

                  _defaults.templates.search ~> | Conditions[0] | { "Column": $docIdColumn , "Value": $lookup($$.soap,$varId) } |
                      ~> | Sorting | { "AttributeName": $docIdColumn }  |
                      ~> | $ | { "Values": $append($keys($$._defaults.mapping.fromWin),["##ObjectPath##"]) } |; 
                  )
              options: 
               requestType: json
            transform: '= { "id": response.data.Result[0].Attributes[Name = "dwDocID"].Value }'
            storeAs: windoc
            errors:
              - condition: = response.data.Count = 0
                code: 404 
                message: = $format("document with DocumentId %s not stored in DMS!", soap.DocumentId)
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)
          - request: 
              method: post 
              url: "/windream.web.api/documents/Update"
              body: | 
                = (
                    $attrs := soap.documentProperties.{ 
                      "Name": $lookup($$._defaults.mapping.toWin, key), 
                      "Value": $count([value]) < 2 ? [value][0] : value 
                    };

                    _defaults.templates.update ~> | Item | { "Id": $$.windoc.id, "Attributes": [$attrs] } |
                  )
              options:
                requestType: json
            errors: 
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)

      getDocumentData: 
        invoke:
          - request:
              method: post
              url: "/windream.web.api/search/Search"
              body: |
                = (
                  $varId := soap.wilkenID ? "wilkenID" : "dmsID"; 
                  $docIdColumn := $lookup(_defaults.mapping.toWin,$varId);

                  _defaults.templates.search ~> | Conditions[0] | { "Column": $docIdColumn , "Value": $lookup($$.soap,$varId) } |
                      ~> | Sorting | { "AttributeName": $docIdColumn }  |
                      ~> | $ | { "Values": $append($keys($$._defaults.mapping.fromWin),["##ObjectPath##"]) } |; 
                  )
              options: 
               requestType: json
            transform: |
              = {              
                "id": response.data.Result[0].Attributes[Name = "dwDocID"].Value,
                "filename": response.data.Result[0].Name 
              }     
            storeAs: windoc
            errors:
              - condition: = response.data.Count = 0
                code: 404 
                message: = $format("document with DocumentId %s not stored in DMS!", soap.DocumentId)
              - condition: = response.data.HasErrors
                code: 400 
                message: = $format("windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)
          - request: 
              method: get 
              url: = "/windream.web.api/documents/download"
              params: 
                "['Item.Id']": = windoc.id
              options:
                responseType: buffer
            transform: 
              contentType: = (
                    $parts := $split(windoc.filename,".");
                    $lookup($$._defaults.mimeTypes,$parts[$count($parts) - 1])
                )     
              buffer: = response.data 

      getDMSProperties: 
        invoke:
          request:
            method: post
            url: "/windream.web.api/search/Search"
            body: |
              = (
                  $varId := soap.wilkenID ? "wilkenID" : "dmsID"; 
                  $docIdColumn := $lookup(_defaults.mapping.toWin,$varId);

                  _defaults.templates.search ~> | Conditions[0] | { "Column": $docIdColumn , "Value": $lookup($$.soap,$varId) } |
                      ~> | Sorting | { "AttributeName": $docIdColumn }  |
                      ~> | $ | { "Values": $append($keys($$._defaults.mapping.fromWin),["##ObjectPath##"]) } |; 
               )
            options: 
              requestType: json
          transform: |
            = (
                $toProp := function($v, $k) { { "key": $k, "value": $v } };

                $mimeType := (                 
                    $parts := $split(response.data.Result[0].Name,".");

                    $lookup($$._defaults.mimeTypes,$parts[$count($parts) - 1])
                );
                
                [
                  response.data.Result[0].Attributes.$toProp([Value],$lookup($$._defaults.mapping.fromWin,Name))[ key ],
                  $toProp($mimeType, "mimeType")
                ]
              )
          errors:
            - condition: = response.data.Count = 0
              code: 404 
              message: = $format("document with DocumentId %s not stored in DMS!", soap.DocumentId)
            - condition: = response.data.HasErrors
              code: 400 
              message: = $format("windreamerror with errno %s message %s", response.data.Error.ErrorCode, response.data.Error.Message)

